backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "propiedades"
    label: "Propiedades"
    folder: "propiedades"
    create: true
    slug: "{{slug}}"

    fields:

      - {label: "Título", name: "title", widget: "string"}

      - {label: "Operación", name: "operacion", widget: "select", options: ["Venta", "Alquiler"]}

      - {label: "Tipo de propiedad", name: "tipo", widget: "select", options: ["Casa", "Apartamento", "Terreno", "Local comercial"]}

      - {label: "Localidad", name: "localidad", widget: "string"}

      - {label: "Dirección o zona", name: "direccion", widget: "string", required: false}

      - {label: "Precio", name: "precio", widget: "string"}

      - {label: "Moneda", name: "moneda", widget: "select", options: ["US$", "$"]}

      - {label: "Dormitorios", name: "dormitorios", widget: "number", required: false}

      - {label: "Baños", name: "banos", widget: "number", required: false}

      - {label: "Metros cuadrados", name: "metros", widget: "number", required: false}

      - {label: "Garage", name: "garage", widget: "boolean", default: false}

      - {label: "Patio", name: "patio", widget: "boolean", default: false}
- {label: "Permite mascotas", name: "mascotas", widget: "boolean", default: false, required: false}

      - {label: "Apta para crédito bancario", name: "credito", widget: "boolean", default: false, required: false}

      - label: "Fotos"
        name: "fotos"
        widget: "list"
        field:
          label: "Imagen"
          name: "imagen"
          widget: "image"

      - {label: "Descripción", name: "descripcion", widget: "markdown"}
      - {label: "Descripción", name: "descripcion", widget: "markdown"}

      - {label: "Fotos", name: "fotos", widget: "list", field: {label: "Foto", name: "foto", widget: "image"}}
